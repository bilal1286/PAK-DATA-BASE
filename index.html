    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600;700&display=swap');

        :root {
            --neon-red: #ff0000;
            --darker: #050505;

        body {
            background-color: var(--darker);
            color: #eee;
            font-family: 'Rajdhani', sans-serif;
        }

        .logo-font { font-family: 'Orbitron', sans-serif; }

        /* VIP Neon Frame */
        .neon-card {
            background: #0a0a0a;
            border: 1px solid rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .movie-card:hover .neon-card {
            border-color: var(--neon-red);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
            transform: translateY(-5px);
        }

        /* Quality Tags Styling */
        .q-tag {
            font-size: 9px;
            padding: 2px 6px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            color: #888;
        }

        .q-tag:hover, .q-tag.active {
            background: var(--neon-red);
            color: white;
            border-color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }

        /* Animated Buttons */
        .btn-main {
            background: linear-gradient(90deg, #8b0000, #ff0000);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-main:hover {
            box-shadow: 0 0 20px #ff0000;
            filter: brightness(1.2);
        }

        .whatsapp-vip {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
