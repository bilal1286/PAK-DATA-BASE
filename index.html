<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUZAMMIL-MD | ELITE TERMINAL</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
--primary:#ff1a1a;
--secondary:#ff4d4d;
--bg:#050505;
--glass:rgba(255,0,0,0.06);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:radial-gradient(circle at center,#1a0000 0%,#000 100%);
font-family:'Rajdhani',sans-serif;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
color:#fff;
overflow-x:hidden;
}

/* ================= INTRO SCREEN ================= */
#intro-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
animation:fadeOut 1s forwards;
animation-delay:2.5s;
}

.intro-text{
color:var(--primary);
font-family:monospace;
font-size:18px;
text-align:center;
animation:blink 1s infinite;
}

@keyframes blink{
0%,100%{opacity:1;}
50%{opacity:.3;}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* ================= MAIN FRAME ================= */
.main-card{
width:95%;
max-width:520px;
padding:35px 30px;
border-radius:18px;
background:rgba(10,0,0,0.9);
border:1px solid var(--primary);
box-shadow: 0 0 15px rgba(255,0,0,0.3), 0 0 60px rgba(255,0,0,0.15);
backdrop-filter:blur(12px);
position:relative;
}

/* ================= VIP OWNER BUTTON ================= */
.vip-owner-btn{
display:block;
text-align:center;
padding:18px;
margin-bottom:30px;
border-radius:12px;
background:#000;
border:2px solid var(--primary);
text-decoration:none;
position:relative;
overflow:hidden;
transition:.3s;
box-shadow:0 0 20px rgba(255,0,0,.4);
}

.vip-owner-btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,0,0,0.4),transparent);
animation:scan 2s infinite;
}

@keyframes scan{
0%{left:-100%;}
100%{left:100%;}
}

.glitch-text{
color:#fff;
font-family:'Orbitron',sans-serif;
font-weight:bold;
letter-spacing:3px;
}

/* ================= TITLE ================= */
h1{
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:20px;
margin-bottom:25px;
color:#fff;
text-shadow:0 0 12px var(--primary);
}

.tab-group{
display:flex;
gap:8px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
border-radius:8px;
background:#000;
border:1px solid #222;
color:var(--secondary);
cursor:pointer;
font-family:'Orbitron',sans-serif;
transition:.3s;
}

.tab.active{
background:var(--primary);
color:#000;
font-weight:bold;
}

.input-field{
width:100%;
padding:14px;
border-radius:10px;
background:var(--glass);
border:1px solid var(--primary);
color:#fff;
font-size:16px;
text-align:center;
margin-bottom:20px;
outline:none;
}

.scan-btn{
width:100%;
padding:15px;
border-radius:10px;
background:linear-gradient(135deg,#ff0000,#990000);
border:none;
color:#fff;
font-weight:bold;
font-family:'Orbitron',sans-serif;
letter-spacing:2px;
cursor:pointer;
box-shadow:0 0 15px rgba(255,0,0,0.4);
}

#result-box{
margin-top:25px;
display:none;
max-height: 300px;
overflow-y: auto;
padding-right: 5px;
}

/* Custom Scrollbar */
#result-box::-webkit-scrollbar { width: 4px; }
#result-box::-webkit-scrollbar-thumb { background: var(--primary); }

.data-card{
background: rgba(255, 255, 255, 0.03);
padding: 12px;
margin-bottom: 8px;
border-left: 3px solid var(--primary);
border-radius: 4px;
}

.key{ font-size:10px; color:var(--secondary); text-transform:uppercase; display: block; margin-bottom: 2px;}
.val{ font-size:14px; font-weight:bold; color:#fff; word-break: break-all;}

.footer{
margin-top:20px;
text-align:center;
font-size:10px;
color:#555;
letter-spacing:2px;
}
</style>
</head>

<body>

<div id="intro-screen">
<div class="intro-text">
INITIALIZING SECURE TERMINAL...<br>
ACCESS GRANTED TO MUZAMMIL-MD
</div>
</div>

<div class="main-card">

<a href="https://wa.me/923293152414" class="vip-owner-btn" target="_blank">
<span class="glitch-text">MUZAMMIL-MD | CONTACT</span>
</a>

<h1>SECURE DATA PROTOCOL</h1>

<div class="tab-group">
<button class="tab active" id="btn-phone" onclick="setMode('phone',this)">PHONE</button>
<button class="tab" id="btn-nic" onclick="setMode('nic',this)">CNIC</button>
</div>

<input type="text" id="userInput" class="input-field" placeholder="03XXXXXXXXX">

<button class="scan-btn" onclick="startScan()">EXECUTE EXTRACTION</button>

<div id="status-msg" style="text-align:center;color:var(--primary);margin-top:15px;font-family:monospace; font-size: 13px;"></div>

<div id="result-box">
<div id="data-content"></div>
<button onclick="clearSystem()" style="width:100%; background:none; border:1px solid #333; color:#555; padding:8px; margin-top:10px; cursor:pointer; font-size:10px;">TERMINATE DATA SESSION</button>
</div>

<div class="footer">POWERED BY MUZAMMIL-MD</div>

</div>

<script>
let currentMode = 'phone';

function setMode(m, btn) {
    currentMode = m;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('userInput').placeholder = (m === 'phone') ? '03XXXXXXXXX' : '42XXXXXXXXXXXXX';
}

async function startScan() {
    const input = document.getElementById('userInput').value;
    const status = document.getElementById('status-msg');
    const resultBox = document.getElementById('result-box');
    const content = document.getElementById('data-content');

    if (!input) {
        status.innerText = "CRITICAL ERROR: INPUT REQUIRED";
        return;
    }

    // UI Reset
    status.innerText = "BYPASSING FIREWALL... EXTRACTING NODES...";
    resultBox.style.display = 'none';
    content.innerHTML = "";

    try {
        // Dynamic API Call
        const response = await fetch(`https://howler-database-api.vercel.app/api/lookup?${currentMode}=${input}`);
        const result = await response.json();

        // Artificial delay for hacking feel
        setTimeout(() => {
            if (result.status === "success" || result.data) {
                status.innerText = "ACCESS GRANTED: RECORDS FOUND";
                resultBox.style.display = 'block';
                
                const data = result.data || result;
                let html = "";

                // Loop through all keys in the response
                for (let key in data) {
                    if (typeof data[key] !== 'object' && data[key]) {
                        html += `
                            <div class="data-card">
                                <span class="key">${key.replace(/_/g, ' ')}</span>
                                <span class="val">${data[key]}</span>
                            </div>`;
                    }
                }
                content.innerHTML = html || "<p style='color:grey'>No readable data in record.</p>";
            } else {
                status.innerText = "DATABASE ERROR: NO RECORD FOUND";
            }
        }, 1500);

    } catch (error) {
        status.innerText = "CONNECTION TIMEOUT: SERVER UNREACHABLE";
        console.error("Fetch Error:", error);
    }
}

function clearSystem() {
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('userInput').value = "";
    document.getElementById('status-msg').innerText = "SYSTEM PURGED";
}
</script>

</body>
</html>
