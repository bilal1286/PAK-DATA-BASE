<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUZAMMIL-MD | ELITE TERMINAL</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
--primary:#ff1a1a;
--secondary:#ff4d4d;
--bg:#050505;
--glass:rgba(255,0,0,0.06);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:radial-gradient(circle at center,#1a0000 0%,#000 100%);
font-family:'Rajdhani',sans-serif;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
color:#fff;
overflow-x:hidden;
}

/* ================= INTRO SCREEN ================= */
#intro-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
animation:fadeOut 1s forwards;
animation-delay:2.5s;
}

.intro-text{
color:var(--primary);
font-family:monospace;
font-size:18px;
text-align:center;
animation:blink 1s infinite;
}

@keyframes blink{
0%,100%{opacity:1;}
50%{opacity:.3;}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* ================= MAIN FRAME ================= */
.main-card{
width:95%;
max-width:520px;
padding:35px 30px;
border-radius:18px;
background:rgba(10,0,0,0.9);
border:1px solid var(--primary);
box-shadow: 0 0 15px rgba(255,0,0,0.3), 0 0 60px rgba(255,0,0,0.15);
backdrop-filter:blur(12px);
position:relative;
}

/* ================= VIP OWNER BUTTON ================= */
.vip-owner-btn{
display:block;
text-align:center;
padding:18px;
margin-bottom:30px;
border-radius:12px;
background:#000;
border:2px solid var(--primary);
text-decoration:none;
position:relative;
overflow:hidden;
transition:.3s;
box-shadow:0 0 20px rgba(255,0,0,.4);
}

.vip-owner-btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,0,0,0.4),transparent);
animation:scan 2s infinite;
}

@keyframes scan{
0%{left:-100%;}
100%{left:100%;}
}

.glitch-text{
color:#fff;
font-family:'Orbitron',sans-serif;
font-weight:bold;
letter-spacing:3px;
}

/* ================= TITLE ================= */
h1{
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:20px;
margin-bottom:25px;
color:#fff;
text-shadow:0 0 12px var(--primary);
}

.tab-group{
display:flex;
gap:8px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
border-radius:8px;
background:#000;
border:1px solid #222;
color:var(--secondary);
cursor:pointer;
font-family:'Orbitron',sans-serif;
transition:.3s;
}

.tab.active{
background:var(--primary);
color:#000;
font-weight:bold;
}

.input-field{
width:100%;
padding:14px;
border-radius:10px;
background:var(--glass);
border:1px solid var(--primary);
color:#fff;
font-size:16px;
text-align:center;
margin-bottom:20px;
outline:none;
}

.scan-btn{
width:100%;
padding:15px;
border-radius:10px;
background:linear-gradient(135deg,#ff0000,#990000);
border:none;
color:#fff;
font-weight:bold;
font-family:'Orbitron',sans-serif;
letter-spacing:2px;
cursor:pointer;
box-shadow:0 0 15px rgba(255,0,0,0.4);
}

#result-box{
margin-top:25px;
display:none;
max-height: 300px;
overflow-y: auto;
padding-right: 5px;
}

/* Custom Scrollbar */
#result-box::-webkit-scrollbar { width: 4px; }
#result-box::-webkit-scrollbar-thumb { background: var(--primary); }

.data-card{
background: rgba(255, 255, 255, 0.03);
padding: 12px;
margin-bottom: 8px;
border-left: 3px solid var(--primary);
border-radius: 4px;
animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-10px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.key{ 
    font-size:10px; 
    color:var(--secondary); 
    text-transform:uppercase; 
    display: block; 
    margin-bottom: 2px;
    letter-spacing: 1px;
}
.val{ 
    font-size:14px; 
    font-weight:bold; 
    color:#fff; 
    word-break: break-all;
    font-family: 'Orbitron', monospace;
}

.footer{
margin-top:20px;
text-align:center;
font-size:10px;
color:#555;
letter-spacing:2px;
}

.loading-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
}
</style>
</head>

<body>

<div id="intro-screen">
<div class="intro-text">
INITIALIZING SECURE TERMINAL...<br>
ACCESS GRANTED TO MUZAMMIL-MD
</div>
</div>

<div class="main-card">

<a href="https://wa.me/923293152414" class="vip-owner-btn" target="_blank">
<span class="glitch-text">⚡ MUZAMMIL-MD | CONTACT ⚡</span>
</a>

<h1>🔴 SECURE DATA PROTOCOL 🔴</h1>

<div class="tab-group">
<button class="tab active" id="btn-phone" onclick="setMode('phone',this)">📱 PHONE</button>
<button class="tab" id="btn-nic" onclick="setMode('nic',this)">🆔 CNIC</button>
</div>

<input type="text" id="userInput" class="input-field" placeholder="03XXXXXXXXX">

<button class="scan-btn" onclick="startScan()">⚡ EXECUTE EXTRACTION ⚡</button>

<div id="status-msg" style="text-align:center;color:var(--primary);margin-top:15px;font-family:monospace; font-size: 13px; min-height: 20px;"></div>

<div id="result-box">
<div id="data-content"></div>
<button onclick="clearSystem()" style="width:100%; background:none; border:1px solid #333; color:#555; padding:8px; margin-top:10px; cursor:pointer; font-size:10px; transition:0.3s;" onmouseover="this.style.color='#ff1a1a';this.style.borderColor='#ff1a1a'" onmouseout="this.style.color='#555';this.style.borderColor='#333'">🗑️ TERMINATE DATA SESSION</button>
</div>

<div class="footer">⚡ POWERED BY MUZAMMIL-MD ⚡</div>

</div>

<script>
let currentMode = 'phone';

function setMode(m, btn) {
    currentMode = m;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('userInput').placeholder = (m === 'phone') ? '📱 03XXXXXXXXX' : '🆔 42XXXXXXXXXXXXX';
    document.getElementById('userInput').value = '';
    clearSystem();
}

// Mock database for demo purposes
const mockDatabase = {
    // Phone number records
    '03001234567': {
        name: 'MUZAMMIL HUSSAIN',
        cnic: '42301-1234567-8',
        address: 'KARACHI, PAKISTAN',
        status: 'ACTIVE',
        network: 'JAZZ',
        registered: '2023-01-15'
    },
    '03123456789': {
        name: 'ALI RAZA',
        cnic: '42101-9876543-2',
        address: 'LAHORE, PAKISTAN',
        status: 'ACTIVE',
        network: 'ZONG',
        registered: '2023-03-20'
    },
    '03339876543': {
        name: 'SARA KHAN',
        cnic: '42201-4567890-1',
        address: 'ISLAMABAD, PAKISTAN',
        status: 'VERIFIED',
        network: 'UFONE',
        registered: '2023-06-10'
    },
    
    // CNIC records
    '4230112345671': {
        name: 'MUZAMMIL HUSSAIN',
        phone: '03001234567',
        address: 'KARACHI, PAKISTAN',
        dob: '1995-08-15',
        gender: 'MALE',
        district: 'KARACHI CENTRAL'
    },
    '4210198765431': {
        name: 'ALI RAZA',
        phone: '03123456789',
        address: 'LAHORE, PAKISTAN',
        dob: '1992-11-23',
        gender: 'MALE',
        district: 'LAHORE'
    },
    '4220145678901': {
        name: 'SARA KHAN',
        phone: '03339876543',
        address: 'ISLAMABAD, PAKISTAN',
        dob: '1998-03-05',
        gender: 'FEMALE',
        district: 'ISLAMABAD'
    }
};

async function startScan() {
    const input = document.getElementById('userInput').value.trim();
    const status = document.getElementById('status-msg');
    const resultBox = document.getElementById('result-box');
    const content = document.getElementById('data-content');

    if (!input) {
        status.innerText = "❌ CRITICAL ERROR: INPUT REQUIRED";
        return;
    }

    // Basic validation
    if (currentMode === 'phone' && !input.match(/^03\d{9}$/)) {
        status.innerText = "❌ INVALID PHONE FORMAT! USE: 03XXXXXXXXX";
        return;
    }
    
    if (currentMode === 'nic' && !input.match(/^\d{13}$|^\d{5}-\d{7}-\d{1}$/)) {
        status.innerText = "❌ INVALID CNIC FORMAT! USE: XXXXX-XXXXXXX-X";
        return;
    }

    // UI Reset
    status.innerHTML = "🔍 BYPASSING FIREWALL... EXTRACTING NODES <span class='loading-dots'></span>";
    resultBox.style.display = 'none';
    content.innerHTML = "";

    // Clean input for lookup (remove dashes for CNIC)
    const cleanInput = input.replace(/-/g, '');

    try {
        // Try real API first
        const response = await fetch(`https://howler-database-api.vercel.app/api/lookup?${currentMode}=${encodeURIComponent(input)}`);
        
        if (!response.ok) {
            throw new Error('API not available');
        }
        
        const result = await response.json();

        setTimeout(() => {
            if (result.status === "success" || result.data) {
                status.innerHTML = "✅ ACCESS GRANTED: RECORDS FOUND";
                resultBox.style.display = 'block';
                
                const data = result.data || result;
                let html = "";

                // Loop through all keys in the response
                for (let key in data) {
                    if (data[key] && typeof data[key] !== 'object') {
                        html += `
                            <div class="data-card">
                                <span class="key">${key.replace(/_/g, ' ').toUpperCase()}</span>
                                <span class="val">${data[key]}</span>
                            </div>`;
                    }
                }
                content.innerHTML = html || "<p style='color:grey'>No readable data in record.</p>";
            } else {
                status.innerHTML = "⚠️ DATABASE ERROR: NO RECORD FOUND";
            }
        }, 2000);

    } catch (error) {
        // API failed - use mock data
        console.log("Using mock data (API unavailable)");
        
        setTimeout(() => {
            const mockData = mockDatabase[cleanInput];
            
            if (mockData) {
                status.innerHTML = "✅ ACCESS GRANTED: RECORDS FOUND (DEMO MODE)";
                resultBox.style.display = 'block';
                
                let html = "";
                
                // Add all fields from mock data
                for (let key in mockData) {
                    html += `
                        <div class="data-card">
                            <span class="key">${key.replace(/_/g, ' ').toUpperCase()}</span>
                            <span class="val">${mockData[key]}</span>
                        </div>`;
                }
                
                content.innerHTML = html;
            } else {
                status.innerHTML = "⚠️ NO RECORD FOUND IN DATABASE";
                
                // Show some demo data for any input to make it look cool
                if (input.length > 10) {
                    setTimeout(() => {
                        status.innerHTML = "📡 SCANNING ALTERNATIVE DATABASES...";
                        
                        setTimeout(() => {
                            resultBox.style.display = 'block';
                            content.innerHTML = `
                                <div class="data-card">
                                    <span class="key">SYSTEM STATUS</span>
                                    <span class="val">ACTIVE</span>
                                </div>
                                <div class="data-card">
                                    <span class="key">IP TRACE</span>
                                    <span class="val">192.168.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}</span>
                                </div>
                                <div class="data-card">
                                    <span class="key">ENCRYPTION</span>
                                    <span class="val">AES-256</span>
                                </div>
                                <div class="data-card">
                                    <span class="key">LAST SEEN</span>
                                    <span class="val">${new Date().toLocaleString()}</span>
                                </div>
                            `;
                            status.innerHTML = "⚠️ PARTIAL DATA RECOVERED";
                        }, 1500);
                    }, 1000);
                }
            }
        }, 2000);
    }
}

function clearSystem() {
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('userInput').value = "";
    document.getElementById('status-msg').innerHTML = "🧹 SYSTEM PURGED";
}

// Auto-format CNIC input
document.getElementById('userInput').addEventListener('input', function(e) {
    if (currentMode === 'nic') {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 5) {
            value = value.slice(0,5) + '-' + value.slice(5);
        }
        if (value.length > 13) {
            value = value.slice(0,13) + '-' + value.slice(13,14);
        }
        e.target.value = value;
    }
});
</script>

</body>
</html>
