<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUZAMMIL-MD | ELITE TERMINAL</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
--primary:#ff1a1a;
--secondary:#ff4d4d;
--bg:#050505;
--glass:rgba(255,0,0,0.06);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:radial-gradient(circle at center,#1a0000 0%,#000 100%);
font-family:'Rajdhani',sans-serif;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
color:#fff;
overflow:hidden;
}

/* ================= INTRO SCREEN ================= */

#intro-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
animation:fadeOut 3s forwards;
animation-delay:3s;
}

.intro-text{
color:#00ff00;
font-family:monospace;
font-size:18px;
text-align:center;
animation:blink 1s infinite;
}

@keyframes blink{
0%,100%{opacity:1;}
50%{opacity:.3;}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* ================= MAIN FRAME ================= */

.main-card{
width:95%;
max-width:520px;
padding:35px 30px;
border-radius:18px;
background:rgba(10,0,0,0.85);
border:1px solid var(--primary);
box-shadow:
0 0 15px rgba(255,0,0,0.3),
0 0 60px rgba(255,0,0,0.15);
backdrop-filter:blur(12px);
position:relative;
}

/* ================= VIP OWNER BUTTON ================= */

.vip-owner-btn{
display:block;
text-align:center;
padding:18px;
margin-bottom:30px;
border-radius:12px;
background:#000;
border:2px solid var(--primary);
text-decoration:none;
position:relative;
overflow:hidden;
transition:.3s;
box-shadow:0 0 20px rgba(255,0,0,.4);
}

.vip-owner-btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,0,0,0.4),transparent);
animation:scan 2s infinite;
}

@keyframes scan{
0%{left:-100%;}
100%{left:100%;}
}

.vip-owner-btn:hover{
transform:scale(1.05);
box-shadow:0 0 35px var(--primary);
}

.glitch-text{
color:#fff;
font-family:'Orbitron',sans-serif;
font-weight:bold;
letter-spacing:3px;
position:relative;
}

.glitch-text:hover{
animation:glitch 0.4s infinite;
}

@keyframes glitch{
0%{text-shadow:2px 2px red;}
25%{text-shadow:-2px 2px blue;}
50%{text-shadow:2px -2px red;}
75%{text-shadow:-2px -2px blue;}
100%{text-shadow:2px 2px red;}
}

/* ================= TITLE ================= */

h1{
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:20px;
margin-bottom:25px;
color:#fff;
text-shadow:0 0 12px var(--primary);
}

/* ================= TABS ================= */

.tab-group{
display:flex;
gap:8px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
border-radius:8px;
background:#000;
border:1px solid #222;
color:var(--secondary);
cursor:pointer;
font-family:'Orbitron',sans-serif;
transition:.3s;
}

.tab.active{
background:var(--primary);
color:#000;
font-weight:bold;
}

.tab:hover{
background:#111;
}

/* ================= INPUT ================= */

.input-field{
width:100%;
padding:14px;
border-radius:10px;
background:var(--glass);
border:1px solid var(--primary);
color:#fff;
font-size:16px;
text-align:center;
margin-bottom:20px;
outline:none;
transition:.3s;
}

.input-field:focus{
box-shadow:0 0 10px var(--primary);
}

/* ================= EXECUTE BUTTON ================= */

.scan-btn{
width:100%;
padding:15px;
border-radius:10px;
background:linear-gradient(135deg,#ff0000,#990000);
border:none;
color:#fff;
font-weight:bold;
font-family:'Orbitron',sans-serif;
letter-spacing:2px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 15px rgba(255,0,0,0.4);
}

.scan-btn:hover{
background:linear-gradient(135deg,#ff4d4d,#cc0000);
box-shadow:0 0 25px var(--primary);
transform:translateY(-3px);
}

/* ================= RESULT ================= */

#result-box{
margin-top:25px;
display:none;
animation:fade .5s ease-in-out;
}

.data-card{
background:rgba(255,0,0,0.06);
padding:10px;
margin-bottom:8px;
border-left:3px solid var(--primary);
border-radius:6px;
}

.key{
font-size:11px;
color:var(--secondary);
text-transform:uppercase;
}

.val{
display:block;
font-size:15px;
font-weight:bold;
color:#fff;
}

.footer{
margin-top:20px;
text-align:center;
font-size:10px;
color:#555;
letter-spacing:2px;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<!-- INTRO SCREEN -->
<div id="intro-screen">
<div class="intro-text">
INITIALIZING SECURE TERMINAL...<br>
ACCESS GRANTED TO MUZAMMIL-MD
</div>
</div>

<div class="main-card">

<!-- VIP OWNER BUTTON -->
<a href="https://wa.me/923293152414" class="vip-owner-btn" target="_blank">
<span class="glitch-text">CONTACT OWNER</span>
</a>

<h1>SECURE DATA PROTOCOL</h1>

<div class="tab-group">
<button class="tab active" onclick="setMode('phone',this)">PHONE</button>
<button class="tab" onclick="setMode('nic',this)">CNIC</button>
</div>

<input type="text" id="userInput" class="input-field" placeholder="03XXXXXXXXX">

<button class="scan-btn" onclick="startScan()">EXECUTE EXTRACTION</button>

<div id="status-msg" style="text-align:center;color:var(--primary);margin-top:15px;font-family:monospace;"></div>

<div id="result-box">
<div id="data-content"></div>
</div>

<div class="footer">POWERED BY MUZAMMIL-MD</div>

</div>

<script>
let currentMode='phone';

function setMode(m,btn){
currentMode=m;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
btn.classList.add('active');
document.getElementById('userInput').placeholder=
m==='phone'?'03XXXXXXXXX':'42XXXXXXXXXXXXX';
}
</script>

</body>
</html>
